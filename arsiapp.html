<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Sitio Fuera de Línea — Acceso Restringido</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 12px; color: #f8fafc; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Acceso Restringido</span>
    <h1>Portal Fuera de Línea</h1>
    <p>Este sitio demostrativo se encuentra temporalmente oculto y deshabilitado para acceso público por solicitud de privacidad del titular.</p>
  </main>
</body>
</html>
